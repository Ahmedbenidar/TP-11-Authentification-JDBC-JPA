spring.application.name=portail-securise
server.port=8098

spring.datasource.url=jdbc:mysql://localhost:3306/portail_usmba_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.thymeleaf.cache=false

logging.level.ma.usmba.portail=INFO
logging.level.org.springframework.security=INFO
